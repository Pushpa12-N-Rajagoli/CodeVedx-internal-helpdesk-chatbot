<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Helpdesk Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="chat-container">


        <!-- HEADER -->

        <div class="chat-header">

            <div class="bot-icon">
                🤖
            </div>

            <div class="header-text">

                <h2>
                    AI Helpdesk Chatbot
                </h2>

                <p>
                    Internal Employee Support
                </p>

            </div>

        </div>



        <!-- CHAT AREA -->

        <div class="chat-area" id="chatArea">


            <!-- WELCOME MESSAGE -->

            <div class="message bot-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="bubble">

                    Hello! 👋

                    <br><br>

                    How can I help you today?

                </div>

            </div>



            <!-- CHAT HISTORY -->

            {% for message in messages %}


                <!-- USER QUESTION -->

                <div class="message user-message">

                    <div class="bubble">

                        {{ message.question }}

                    </div>

                </div>



                <!-- BOT ANSWER -->

                <div class="message bot-message">

                    <div class="avatar">
                        🤖
                    </div>

                    <div class="bubble">

                        {{ message.answer }}

                    </div>

                </div>


            {% endfor %}


        </div>



        <!-- INPUT AREA -->

        <form method="POST"
              class="input-area">


            <input
                type="text"
                name="question"
                placeholder="Type your question..."
                autocomplete="off"
                required
            >


            <button type="submit">
                Send
            </button>


           

        </form>


    </div>



    <!-- AUTO SCROLL -->

    <script>

        const chatArea =
            document.getElementById("chatArea");

        chatArea.scrollTop =
            chatArea.scrollHeight;

    </script>


</body>

</html>
